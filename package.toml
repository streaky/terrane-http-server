package = "streaky/http-server"
artifact = "library"
rust-toolchain = "pinned"
[consumer-tools]
http = "consumer/package.toml"

[namespaces]
"streaky/http-server" = "src"

[rust-dependencies.axum]
version = "=0.8.9"
features = ["ws"]
effects = ["build", "networking"]

[rust-dependencies.axum-core]
version = "=0.5.6"
effects = ["build"]

[rust-dependencies.hyper]
version = "=1.12.0"
default-features = false
features = ["server", "http1", "http2"]
effects = ["build", "networking"]

[rust-dependencies.hyper-util]
version = "=0.1.21"
default-features = false
features = ["server-auto", "tokio", "service", "http1", "http2"]
effects = ["build", "networking"]

[rust-dependencies.tokio]
version = "=1.53.3"
default-features = false
features = ["net", "sync"]
effects = ["build", "networking"]

[rust-modules]
conversions = "rust/conversions.rs"

[rust-dependencies.http]
version = "=1.5.0"
effects = ["build"]

[rust-dependencies.http-body]
version = "=1.1.0"
effects = ["build"]

[rust-dependencies.tower-http]
version = "=0.6.6"
features = ["fs", "add-extension"]
effects = ["build", "filesystem"]

[rust-dependencies.tower-service]
version = "=0.3.3"
effects = ["build"]

[rust-dependencies.ipnet]
version = "=2.11.0"
effects = ["build"]

[rust-dependencies.client-ip]
version = "=0.2.1"
features = ["forwarded-header"]
effects = ["build"]

[rust-dependencies.urlencoding]
version = "=2.1.3"
effects = ["build"]

[testing]
unit = "tests/unit"
