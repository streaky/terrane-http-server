package = "streaky/http-server"
artifact = "library"
rust-toolchain = "pinned"

[namespaces]
"streaky/http-server" = "src"

[consumer-tools]
http = "consumer/package.toml"

[rust-dependencies.axum]
version = "=0.8.9"
features = ["ws"]
effects = ["build", "networking"]

[rust-dependencies.axum-core]
version = "=0.5.6"
effects = ["build"]

[rust-dependencies.hyper]
version = "=1.12.0"
default-features = false
features = ["server", "http1", "http2"]
effects = ["build", "networking"]

[rust-dependencies.hyper-util]
version = "=0.1.21"
default-features = false
features = ["server-auto", "tokio", "service", "http1", "http2"]
effects = ["build", "networking"]

[rust-dependencies.tokio]
version = "=1.53.3"
default-features = false
features = ["net", "sync", "fs", "io-util", "time"]
effects = ["build", "networking", "filesystem"]

[rust-modules]
# Native Body poll/size-hint implementations and bounded body collection.
conversions = "rust/conversions.rs"
# Pinned Hyper connection draining with admission leases through upgrades.
shutdown_serving = "rust/shutdown_serving.rs"
# Native Tower Layer/Service and Body wrappers observe streaming and drop.
observation = "rust/observation.rs"
# Stream borrowed multipart fields into the original temporary descriptors.
multipart = "rust/multipart.rs"

[rust-dependencies.multer]
version = "=3.1.0"
effects = ["build"]

[rust-dependencies.futures-util]
version = "=0.3.34"
effects = ["build"]

[rust-dependencies.http]
version = "=1.5.0"
effects = ["build"]

[rust-dependencies.http-body]
version = "=1.1.0"
effects = ["build"]

[rust-dependencies.http-body-util]
version = "=0.1.5"
effects = ["build"]

[rust-dependencies.tower-http]
version = "=0.6.6"
features = ["fs", "add-extension"]
effects = ["build", "filesystem"]

[rust-dependencies.tower-service]
version = "=0.3.3"
effects = ["build"]

[rust-dependencies.ipnet]
version = "=2.11.0"
effects = ["build"]

[rust-dependencies.client-ip]
version = "=0.2.1"
features = ["forwarded-header"]
effects = ["build"]

[rust-dependencies.urlencoding]
version = "=2.1.3"
effects = ["build"]

[rust-dependencies.serde-json]
# Keep the consumer graph on the same exact serde_json version as the native observer.
package = "serde_json"
version = "=1.0.151"
effects = ["build"]

[rust-dependencies.tower]
version = "=0.5.3"
default-features = false
effects = ["build"]

[rust-dependencies.pin-project-lite]
version = "=0.2.17"
effects = ["build"]

[testing]
unit = "tests/unit"
