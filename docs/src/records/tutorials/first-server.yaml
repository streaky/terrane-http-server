id: http-server.tutorial.first-server
kind: topic
surface: null
lifecycle:
  status: current
  stability: experimental
  since: "unversioned"
  deprecated-since: null
  removed-in: null
  replacement: null
documentation:
  status: complete
  title: Build your first HTTP server
  title-style: text
  summary: >-
    Build a small Terrane application with class-bound GET and HEAD endpoints,
    request-scoped contexts, explicit shared state, and a static directory.
  tags: [http-server, tutorial, getting-started]
  blocks:
    - type: markdown
      markdown: |-
        This tutorial assumes a working Terrane compiler and a local checkout of
        `http-server`. It uses only the current public library API. You do not
        need to construct Axum routers, write Rust adapters, or declare the
        library's Rust dependencies again in your application.
  sections:
    - id: create-the-project
      title: Create the project
      blocks:
        - type: markdown
          markdown: |-
            Create a directory named `hello-http` beside the package that
            provides the `streaky/http-server` namespace. The manifest below
            resolves `../http-server` relative to `hello-http/package.toml`;
            adjust that dependency path if your checkout layout differs. Keep
            all four files under `hello-http`.

            The application's profile permits building, network access, static
            file reads, and the thread-backed executor. The library is
            source-composed into this application. Its native dependency
            requirements remain part of the final application's capability
            policy.
        - type: example
          id: complete-server
          title: A complete application
          language: terrane
          mode: build
          target: null
          timeout-ms: null
          files:
            - path: package.toml
              language: toml
              source: |-
                package = "hello-http"
                rust-toolchain = "pinned"

                [profile]
                capabilities = ["build", "networking", "filesystem", "clocks"]

                [namespaces]
                hello-http = "src"

                [terrane-dependencies.streaky.http-server]
                path = "../http-server"
            - path: src/site.trn
              language: terrane
              source: |-
                namespace hello-http

                from /streaky/http-server import api
                from /streaky/http-server/annotations import route-group, endpoint

                @[route-group; prefix = '/']
                class site-api uses api
                    @[endpoint; method = 'GET|HEAD', path = '/']
                    async function home string;
                        return 'Hello from http-server!'

                    @[endpoint; method = 'GET', path = '/about']
                    async function about string;
                        return 'A Terrane application with text and static routes.'
            - path: src/main.trn
              language: terrane
              source: |-
                namespace hello-http

                from /streaky/http-server import create-application
                from /core/errors import throwable

                async function main none throws throwable;
                    app = create-application;
                    app = app.mount-annotated; '/site', (instance site-api;)
                    app = app.static-directory; '/static', 'public'
                    await app.serve;
                    return none
            - path: public/hello.txt
              language: text
              source: |-
                Hello from the static directory!
          entry: package.toml
          response: null
          diagnostic: null
          markdown: |-
            This example is a buildable project, not a finite `run` example:
            serving normally continues until the process is stopped. The local
            `http-server` dependency must be available at the declared path.
      sections: []
    - id: understand-the-api
      title: Understand the API class
      blocks:
        - type: markdown
          markdown: |-
            `site-api` declares `uses api`; its HTTP methods carry `endpoint`
            metadata inside a `route-group`. The consumer generates route
            adapters from the selected declarations, so there is no `controller`
            implementation or manual routes builder. `GET|HEAD` on `home`
            exposes both methods at `/`; HEAD suppresses the body. The `about`
            method is GET-only. Mounting the API class at `/site` places these
            endpoints under that prefix. Static content is mounted separately.
      sections: []
    - id: run-and-request
      title: Run the server and make requests
      blocks:
        - type: markdown
          markdown: |-
            Run the following command from `hello-http`. The default address is
            `127.0.0.1:3000`, so the server is initially reachable only on the
            local machine. Leave this terminal running and make requests from
            a second terminal. Stop the process with your terminal's interrupt
            when finished; the library does not currently expose a graceful
            shutdown callback.
        - type: example
          id: run-command
          title: Start the application
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            terrane run .
          response: null
          diagnostic: null
          markdown: null
        - type: example
          id: request-home
          title: Request the home page
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            curl -sS http://127.0.0.1:3000/
          response:
            kind: stdout
            language: text
            display: shown
            content: |-
              Hello from http-server!
          diagnostic: null
          markdown: null
        - type: example
          id: request-static
          title: Request the static file
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            curl -sS http://127.0.0.1:3000/static/hello.txt
          response:
            kind: stdout
            language: text
            display: shown
            content: |-
              Hello from the static directory!
          diagnostic: null
          markdown: null
        - type: markdown
          markdown: |-
            `/about` exercises the second text handler. A missing route is
            handled by the router because no annotated endpoint matches it.
            Static paths are resolved against `public` from the process's
            working directory, which is why these commands start in the project
            root. If port 3000 is already in use, insert a `with-address` call
            before `serve` and use that address in your requests.
        - type: example
          id: choose-address
          title: Choose another listen address
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            app = app.with-address; '127.0.0.1:8081'
          response: null
          diagnostic: null
          markdown: null
      sections: []
    - id: add-request-context
      title: Read request context safely
      blocks:
        - type: markdown
          markdown: |-
            Each selected API class declares `uses api`. The trait supplies optional
            `request` and `response` fields that are `none` outside a dispatched
            request. Generated code copies the mounted class into a fresh invocation
            for every HTTP request, attaches that request's contexts, then calls the
            endpoint method. The mounted source is not mutated, so concurrent requests
            do not overwrite one another's context. Helper methods on the invocation
            see the same request and response contexts.

            Narrow optional context fields before use. This illustrative GET endpoint
            returns the request method, and demonstrates that context belongs to the
            current invocation rather than a handler parameter.
        - type: example
          id: request-context-handler
          title: Read a request field
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            from /streaky/http-server import api

            class request-api uses api
                @[endpoint; method = 'GET', path = '/method']
                async function request-method string
                    current-request = this.request
                    if current-request != none
                        return current-request.method;
                    return 'No request is being dispatched.'
          response: null
          diagnostic: null
          markdown: null
        - type: markdown
          markdown: |-
            Ordinary class fields have value semantics. A list or map stored on the
            mounted class is not implicitly shared mutable state across invocation
            copies. If requests must observe persistent application data, store it
            behind an explicit shared reference and synchronize mutations using the
            store's chosen concurrency policy. Keep per-request values in the context;
            do not stash them in shared application state.
      sections: []
    - id: add-client-identity
      title: Use request identity
      blocks:
        - type: markdown
          markdown: |-
            Request identity and request metadata are read from `this.request`, an
            optional context attached to this request's invocation. Use its
            `client-ip()` getter to inspect the trusted resolved address. The getter
            may return `none`; consult [[http-server.guide.proxy-security]] before
            relying on forwarded identity.
        - type: example
          id: client-handler
          title: Handle resolved or unresolved identity
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            from /streaky/http-server import api

            class identity-api uses api
                @[endpoint; method = 'GET', path = '/identity']
                async function identity string
                    current-request = this.request
                    if current-request != none
                        trusted = current-request.via-trusted-proxy;
                        address = current-request.client-ip;
                        if address != none
                            return 'Resolved client address available.'
                        if trusted
                            return 'Trusted proxy supplied no usable client identity.'
                    return 'Client identity unresolved.'
          response: null
          diagnostic: null
          markdown: null
        - type: markdown
          markdown: |-
            With this tutorial's empty direct allowlist, forwarded headers are
            ignored and the resolved client is the TCP peer. The peer and
            client accessors return optional projected address values, not strings.
            Do not trust a header merely because it is present; configure proxy trust
            as described in [[http-server.guide.proxy-security]] before deploying.
      sections: []
    - id: add-a-websocket
      title: Add a one-message WebSocket echo
      blocks:
        - type: markdown
          markdown: |-
            WebSocket registration is separate from annotated HTTP endpoints.
            Connect with a WebSocket client, send a text message, and observe
            the echo and close. This tutorial keeps the WebSocket callback
            example separate from HTTP route authoring.
      sections: []
    - id: choose-next-steps
      title: Configure and deploy deliberately
      blocks:
        - type: markdown
          markdown: |-
            The application is now small enough to understand end to end. Move
            addresses and mounts into YAML using
            [[http-server.guide.configuration]] when you need deployment-specific
            composition. YAML identifies API classes and their prefixes; its
            source mapping supplies the selected Terrane class instances. It does
            not configure either network allowlist.

            Before exposing the listener, review
            [[http-server.guide.proxy-security]]. The current forwarded-identity
            policy supports a single trusted edge proxy, not arbitrary
            multi-hop traversal. Set the proxy and client allowlists separately
            if you need both connection enforcement and originating-client
            restrictions.

            Consult [[http-server.api.application]] for application builders and
            [[http-server.guide.annotations]] for typed endpoints, request
            extraction, structured responses, and supported GET and HEAD methods.
            Binary WebSocket payloads and graceful shutdown remain outside the
            current public APIs.
      sections: []
  see-also:
    - http-server.guide.application-routing
    - http-server.guide.configuration
    - http-server.guide.proxy-security
    - http-server.guide.websockets
