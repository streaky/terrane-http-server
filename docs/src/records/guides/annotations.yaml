documentation:
  status: complete
  title: Annotated endpoints and OpenAPI
  title-style: text
  summary: Generate typed HTTP adapters and an OpenAPI document from explicitly selected annotated handlers.
  tags: [http-server, annotations, openapi]
  blocks:
    - type: markdown
      markdown: |-
        HTTP annotations are ordinary typed declaration metadata. They do not register routes
        merely by appearing in source. Build the package's native consumer and configure it
        explicitly in the application manifest. The compiler passes selected canonical
        declaration metadata to that executable and checks its generated Terrane source through
        the ordinary package pipeline. No HTTP-specific compiler behavior or runtime source
        reflection is involved.

        Selected safe asynchronous handlers may be standalone functions or shared methods on
        selected classes and may declare `throws throwable`. Path and query parameters are
        `string`, `int`, or `bool`; query defaults must be compile-time scalar values of the
        declared type. Results may be JSON-encoded scalars, `document-value`, selected
        ordinary model classes, or `string` for `text/html` and `text/plain`. Automatically
        encoded responses can negotiate JSON, YAML, or XML when enabled on their route group.
        `http-response` bypasses automatic encoding: the handler owns status, headers, content
        type, and body. A body may be a decoded `document-value` or a selected model class.
        Model schemas and codecs derive from actual fields, including nested values. Schemas
        are assembled as document trees and encoded with Terrane's canonical JSON encoder.
        Request bodies remain JSON: response negotiation never changes how inputs are decoded.

        Explicit `operation-id` values remain unchanged. Otherwise the consumer derives a
        unique URL-safe ID from the canonical declaration identity, so documentation viewers
        can navigate operations without treating namespace separators as URL path segments.

        Throw `http-error` with an error status or an explicit error response for an early
        exit. The server preserves it instead of converting it to a generic 500. OpenAPI
        uses a default response for handler-defined statuses; explicit response handlers do
        not claim a fixed 200/content schema. Other handlers retain their automatic 200
        schema, and all document request validation and internal error boundaries.
    - type: example
      id: annotated-handler
      title: A typed path parameter and optional query parameter
      language: terrane
      mode: illustrative
      target: null
      timeout-ms: null
      source: |-
        from /streaky/http-server/annotations import endpoint, path, query

        /// Calculate a catalog quantity.
        /// @returns The item identifier multiplied by the requested quantity.
        @[endpoint; method = 'GET', path = '/items/{item-id}', summary = 'Read an item']
        async function read-item int; (
            /// Identifier of the catalog item.
            @[path;] item-id int,
            /// Number of units, defaulting to one.
            @[query;] quantity int = 1,
        )
            return item-id * quantity
      response: null
      diagnostic: null
      markdown: null
    - type: example
      id: examples-and-formats
      title: Authored examples and negotiated response formats
      language: terrane
      mode: illustrative
      target: null
      timeout-ms: null
      source: |-
        from /core/collections import list
        from /streaky/http-server/annotations import route-group, endpoint, body, request-example, response-example, api-documentation

        class count-input
            /// Requested number of units.
            quantity int

        /// # Count API
        ///
        /// Echo a count without storing it. Requests use **JSON**; choose a response
        /// representation with the Accept header.
        @[api-documentation; title = 'Count API', version = '0.1.0']
        @[route-group; prefix = '/api', response-formats = (list; 'json', 'yaml', 'xml'), default-response-format = 'json']
        class count-api
            /// Echo a typed count, without saving it.
            ///
            /// ```console
            /// curl -H 'Content-Type: application/json' -H 'Accept: application/yaml' \
            ///   -d '{"quantity":3}' http://localhost:3187/api/count
            /// ```
            /// @returns The supplied count in the negotiated representation.
            @[endpoint; method = 'POST', path = '/count']
            @[response-example; name = 'three', value = '{"quantity":3}']
            async function echo-count count-input; (
                @[body;] @[request-example; name = 'three', value = '{"quantity":3}'] value count-input,
            )
                return value
      response: null
      diagnostic: null
      markdown: null
  sections:
    - id: consumer-configuration
      title: Explicit consumer configuration
      blocks:
        - type: markdown
          markdown: |-
            Run `sh packages/http-server/build-consumer.sh` from the repository root; it builds
            and stages the native HTTP and template consumers. The HTTP executable is at
            `.trn/consumers/http-server`; configure its command relative to the application
            package directory. Select every handler and each of its parameter declarations;
            parameter identities append `::parameter-name` to the callable identity. The
            command is trusted executable code, not a sandbox.
        - type: example
          id: consumer-manifest
          title: Manifest for an application beside the HTTP package
          language: toml
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            [terrane-dependencies]
            http-server = { path = "../http-server" }

            [consumers.http-server]
            command = "../http-server/.trn/consumers/http-server"
            declarations = [
              "/catalog::read-item",
              "/catalog::read-item::item-id",
              "/catalog::read-item::quantity",
            ]
          response: null
          diagnostic: null
          markdown: null
        - type: markdown
          markdown: |-
            `mount-annotated` configures an application from explicitly selected source
            classes. It instantiates each class, mounts its generated wrapper at the
            `route-group` prefix, and applies its `static-directory` declarations. The
            generated OpenAPI document is served at `/api/openapi.json` when the API class
            uses prefix `/api`; its schema paths include that prefix and its server URL is
            `/`. A group may set `document = false` to keep its endpoints out of the API
            schema while still serving HTML pages.

            Source classes have ordinary value semantics. A collection field alone is not
            shared mutable application state across copied callback receivers. The native
            catalog demo instead initializes one explicit `shared ref catalog-store` whose
            ordered map is seeded during mounting. Short synchronous store methods perform
            complete operations on that shared identity; handlers retain a local owning
            reference before invoking mutations. No store operation suspends or retains a
            lock across `await`. Changes are process-local and disappear on restart.
    - id: overview
      title: API title, version, and overview
      blocks:
        - type: markdown
          markdown: |-
            Place `api-documentation` on one selected class or callable, such as the API's
            route-group class or application entry function. Its `title` and `version` set
            OpenAPI `info.title` and `info.version`, which documentation viewers display as
            the API name and version. This is the application's API version, not the
            OpenAPI specification version.

            The annotated declaration's `///` or `/** ... */` documentation becomes
            `info.description`, providing the overview page's content. It supports the same
            CommonMark formatting as endpoint descriptions: headings, paragraphs, emphasis,
            lists, links, and fenced code examples. The entire comment is overview content;
            the endpoint-only `@returns` convention is not applied here.

            An explicit `description` string overrides the declaration comment, including an
            empty string to suppress the overview. Omitted `description` (or explicit `none`)
            uses the comment. With no selected `api-documentation` annotation, the existing
            `HTTP API` title and `1.0.0` version remain the defaults, with no overview text.
            Those are also the title/version defaults when the annotation omits those fields.

            API information belongs to the single generated OpenAPI document, not separately
            to each route group. At most one selected declaration may carry this annotation;
            multiple owners produce a consumer diagnostic rather than depending on selection
            order. Remember to include the owning declaration in `[consumers.http-server]`'s
            `declarations` list. The catalog demo annotates its already-selected API class.
    - id: metadata
      title: Metadata and validation
      blocks:
        - type: markdown
          markdown: |-
            Import annotations from `/streaky/http-server/annotations`. `endpoint` on a method supplies
            `path`, `method`, optional `summary`, `description`, and `operation-id`, plus
            `content-type` (default `application/json`). `path` and `query` supply an optional
            external `name`, defaulting to the parameter name. `body` identifies one JSON body
            parameter. Each parameter has exactly one transport annotation. Path placeholders
            must match the selected path parameters.

            Requiredness and JSON schema types come from the actual signature. A path
            parameter is always required. A query parameter without a default is required;
            a default appears in both runtime extraction and OpenAPI. Integer conversion,
            strict boolean conversion, missing required values, and malformed JSON fail with
            HTTP 422 before calling the handler. The generated endpoint callback accepts the
            ordinary `throws throwable` effect, so handler failures propagate to the HTTP
            boundary as HTTP 500 rather than being converted into input errors.
            Generated responses default to `application/json`. A returned string is a JSON
            string, not raw JSON text; string endpoints may instead select `text/html` or
            `text/plain`. Request bodies remain JSON: response negotiation never changes
            how inputs are decoded.

            A route group opts into negotiated automatic responses by explicitly setting
            `response-formats` to a nonempty list drawn from `json`, `yaml`, and `xml`.
            Omitting it, or setting it to `none`, preserves the legacy JSON-only behavior:
            `Accept` is ignored and does not cause a 406. Free-function endpoints use that
            same implicit policy. An explicitly empty list is rejected, not replaced with JSON.

            An explicit list enables strict negotiation even if it contains only `json`.
            An empty `default-response-format` selects the first enabled format; an explicit
            default must be enabled. Missing `Accept` uses that default. Quality values and
            wildcard specificity choose among enabled formats; a specific zero-quality
            exclusion overrides a broader wildcard. No acceptable choice produces HTTP 406
            before input validation or handler execution: an unacceptable `Accept` wins
            over malformed path, query, or body input, returning 406 rather than 422.
            JSON's `charset` parameter is ignored, as specified by
            [RFC 8259 section 11](https://www.rfc-editor.org/rfc/rfc8259#section-11). XML and
            YAML satisfy `charset=utf-8`, case-insensitively and with optional quotes;
            other charsets do not match those representations. Unsupported media constraints
            such as `profile` before `q` remain nonmatching. Malformed byte
            ranges are discarded individually, preserving usable alternatives and exclusions.
            Matching uses the canonical `application/json`, `application/yaml`, and
            `application/xml` types plus wildcards; aliases such as `text/xml`,
            `application/x-yaml`, and `text/yaml` are not treated as equivalent.

            Every response from a negotiated endpoint varies on `Accept`, including 406,
            validation 422, thrown HTTP errors, and unexpected/conversion 500 responses.
            Existing `Vary` values are preserved; an existing `Accept` token or `*` already
            covers the variation. Error bodies retain their existing media types and handling.
            OpenAPI advertises each enabled media type; `x-default-response-content-type`
            records the default, because OpenAPI has no standard default-media field.
            Format policy is validated once at the selected route-group declaration, including
            groups without selected methods; errors point to that class rather than a method.
            Explicit `http-response` values remain handler-controlled; HTML and plain-text
            endpoint content types bypass automatic serialization and negotiation.

            JSON uses the canonical document representation. YAML responses use
            `application/yaml` with readable block collections and JSON-compatible scalar
            quoting. XML responses use `application/xml`, with a `response` root; model/map
            fields become child elements, arrays use a wrapper with `item` children, and null
            uses `xsi:nil="true"` with the standard XML Schema instance namespace. Empty strings
            are empty non-nil elements. XML map keys must match `[A-Za-z_][A-Za-z0-9_.-]*`;
            unsupported names and XML-forbidden control characters fail response construction
            instead of producing malformed XML. Request bodies remain JSON.

            Body and result types may be explicitly selected public Terrane model classes
            with canonical default constructors. The consumer uses their public non-static
            fields to generate typed JSON codecs and object schemas, including nested model
            lists. Unknown fields and mismatched JSON types fail with 422. Missing fields
            retain the class's actual defaults, including Terrane's implicit scalar and
            collection defaults; a bare integer field therefore defaults to zero rather than
            becoming required merely because it has no written initializer. Custom
            constructors and derived model classes are currently rejected.
            Named component schemas retain each class's title and use references for nested
            models, including recursive model lists. Supported scalar fields include strings,
            booleans, exact/fixed-width integers, and finite binary floats; scalar/model lists
            and nullable fields need no document-map construction in application code.

            Documentation comments also describe the inputs and outputs in OpenAPI. Put a
            `///` or `/** ... */` comment immediately before a parameter's transport annotation
            to populate its parameter or request-body description. Comments on selected model
            classes describe component schemas; comments on their public fields describe
            properties, including nested objects, lists, and nullable values. These descriptions
            do not change validation, defaults, or requiredness.
            Select each field's canonical declaration in the consumer's `declarations` list
            to expose its comment; selecting the class alone still supplies its type/default
            contracts but not field documentation. Undocumented or unselected field comments
            are omitted from OpenAPI, rather than rendered as a placeholder description.
            Use repeatable `request-example` annotations on parameter declarations and
            `response-example` annotations on handlers. Each has `name` (default `default`),
            optional `summary` and `description`, and required `value` as JSON source text.
            JSON parsing preserves scalar, array, object, and null values; names must be
            nonempty and unique on that declaration. Examples document useful calls and
            responses but do not constrain runtime behavior and are not checked against their
            schemas. Body examples remain JSON even
            when responses negotiate YAML or XML. OpenAPI examples belong to their matching
            media types and parameter/request-body objects.
            YAML examples retain the parsed structured value; XML examples are serialized
            strings using the same encoder as runtime responses. Text/HTML examples must
            contain a JSON string. Invalid example JSON or duplicate names fail compilation.

            Declaration comments support CommonMark, including paragraphs, emphasis, links,
            lists, and fenced code blocks. Keep `@returns` as the final documentation section:
            it describes the automatic 200 response (or the default response for an explicit
            `http-response` handler), independently of the operation description. See
            [OpenAPI rich-text formatting](https://spec.openapis.org/oas/v3.1.0.html#rich-text-formatting)
            and the [Media Type Object](https://spec.openapis.org/oas/v3.1.0.html#media-type-object)
            for the specification details.

            End an endpoint's documentation with `@returns ` followed by the response
            description. The marker must start a documentation line with no indentation and
            include the following space. A marker inside a valid CommonMark fence is code,
            not metadata. Backtick openers cannot contain another backtick in their info
            string, so an inline-code-looking line cannot swallow a following returns section.
            A bare `@returns` or an indented marker remains ordinary Markdown prose; it
            does not start a response section and does not produce a diagnostic.
            After a recognized marker, following lines belong to that response description
            until the documentation ends.
            The preceding prose describes the operation, unless the endpoint supplies an explicit
            `description`. The returns section applies independently of that override. It
            describes the automatic 200 response, or the default response for an explicit
            `http-response` handler. Without a returns section, existing generic response
            descriptions remain in use. This is an HTTP consumer documentation convention,
            not a new language annotation or a way to describe arbitrary document-value keys;
            use selected typed models to document individual object properties.

            The consumer rejects unsupported signatures, contradictory parameter metadata,
            duplicate registrations and operation IDs, invalid methods or paths, and the
            reserved `/api/openapi.json` route. Declaration documentation provides a
            description when explicit metadata does not provide one. GET, POST, PUT, PATCH,
            DELETE, HEAD, and OPTIONS are supported operation methods. GET may also be
            served for HEAD by the framework; explicit HEAD registration overrides it and
            produces a bodyless wire response. Typed HEAD handlers should produce the same
            negotiated representation as GET so the native router can preserve its headers
            while suppressing its body. An explicit `http-response` HEAD handler owns its
            headers, including content type, length, and cache variation; an empty body
            without an explicit length yields `Content-Length: 0`, not GET's encoded length.
            OPTIONS requires an explicit handler and does not provide automatic CORS behavior.
            `route-group` is class metadata
            with `prefix` (default `/`) and `document` (default `true`). `static-directory`
            is repeatable class metadata with an absolute URL `path` and a directory relative
            to the process working directory. Endpoint metadata adds `content-type`, default
            `application/json`; `text/html` and `text/plain` responses require string results.

            Annotated `static-directory` values currently reject any `..` substring,
            including ordinary names such as `a..b`, not only a parent path segment.
            This is a conservative consumer-validation restriction; use a directory
            name without that substring.

            A narrow authored Rust module, `rust/conversions.rs`, supplies only owned
            conversions: native text to Axum `Body`, buffered bytes to UTF-8 text, and
            percent-decoded text. `projection/from-conversions` tracks the missing concrete
            `From` surface; `projection/owned-percent-decoding` tracks scoped native `Cow`
            results borrowing ordinary source locals. Remove the corresponding adapters
            when ordinary projection admits those capabilities. Routing, query extraction,
            JSON parsing, validation, generation, and OpenAPI construction remain Terrane
            code. This module is not a Rust framework facade and must not gain HTTP policy.

            Where a model uses binary floats, generated codecs use a small typed Rust
            boundary around the standard finite floating-point parser. Numeric coercion does
            not parse document text. This boundary supplies no HTTP behavior or model schema
            rules and requires no Rust code in the application's model classes.
            Non-finite float model outputs are invalid JSON and become HTTP 500 rather
            than a fabricated numeric value or JSON null.
    - id: implementation-tradeoffs
      title: Representation implementation tradeoffs
      blocks:
        - type: markdown
          markdown: |-
            The native annotation consumer depends on the HTTP package so authored XML
            examples use the exact runtime document encoder. This increases the consumer's
            dependency/projection and build footprint. That cost is accepted to avoid two
            subtly different XML contracts; extracting a smaller shared codec dependency is
            not a committed plan. Revisit only if measured build cost warrants it, while
            retaining one authoritative encoder.

            Duplicate checks over small, developer-authored format/example name lists use
            straightforward scans, including quadratic checks where appropriate. A set or a
            general validation framework is unnecessary for these configuration-sized inputs.
            XML name validation and escaping likewise remain explicit, auditable operations.
            Invalid XML keys or characters fail response construction; there is deliberately
            no silent renaming, lossy coercion, or fallback to another enabled representation.

            YAML intentionally uses JSON-compatible scalar quoting and empty collection
            syntax while rendering populated collections as readable blocks. This avoids a
            second scalar escaping contract and preserves exact numbers without float coercion.

            OpenAPI 3.1 permits description and XML metadata alongside a schema reference.
            Reference resolution must preserve these sibling keywords: response-root names
            and collection wrappers can differ from the referenced component's metadata.

            XML null values use `xsi:nil="true"` and a root namespace declaration. The
            OpenAPI 3.1 XML Object has no dedicated nil marker or standalone root
            namespace-declaration facility for this convention. Nullable schema fields still
            use `anyOf` with a null branch; XML clients and generators must also follow the
            documented wire convention.

            Returns-marker detection deliberately follows the strict documented syntax and
            preserves nonmatching text as prose. The consumer protocol currently reports
            fatal errors, not non-fatal warnings; turning plausible prose into a build failure
            would be inappropriate. A warning protocol is not a committed implementation plan.

            Accept matching is deliberately bounded to the supported canonical media types.
            Unsupported parameter constraints, including quoted values containing commas,
            remain nonmatching rather than requiring a general quoted-parameter parser.
            Supporting additional media parameters would require reconsidering that parsing
            boundary; it is not a committed extension.
    - id: consumer-source-templates
      title: Maintaining generated source templates
      blocks:
        - type: markdown
          markdown: |-
            The HTTP consumer itself uses the `template` package for readable multiline
            Terrane source generation. Templates under `consumer/templates/http/` describe
            controller declarations, route registration, the generated preamble, OpenAPI
            access, and validation responses. Templates under `consumer/templates/models/`
            describe model encoders, decoders, field-presence branches, and list loops.
            Metadata validation, schema construction, and source quoting remain ordinary
            Terrane code. Per-operation adapter bodies (parameter extraction, body decode,
            and result encoding) are still hand-assembled, as are model import headers,
            floating-point codec helpers, and per-field kind checks. The template migration
            covers skeletons and selected branches, not all multiline generated source.

            `consumer/package.toml` explicitly selects these `.trn.tpl` entries for AOT
            compilation. `build-consumer.sh` builds the template consumer before building the
            HTTP consumer. The installed HTTP consumer contains compiled renderers and needs
            no template directory or runtime template parsing; annotated applications likewise
            need no code-generation template files.

            Each generation request creates one compiled engine and shares it by reference
            across its fragments. The rendering boundary supplies an independent named
            `data` context to `fetch-context` for each fragment, without changing the engine's
            stored context. HTML autoescaping is explicitly disabled for Terrane source.
            Metadata interpolated as a source literal must first pass through `source-quote`;
            inserting a code fragment does not quote or escape it. JSON documents still use
            the built-in JSON encoder, not templates.

            Template failures become structured consumer diagnostics naming the failing
            template. When adding an entry, update the consumer manifest's explicit template
            list and exercise the generated code through the live consumer integration suite.
            Preserve indentation in optional-field and nested-list branches; test absent,
            null, empty, populated, and malformed values rather than matching generated text.
    - id: demo
      title: Runnable catalog demo and behavioral tests
      blocks:
        - type: markdown
          markdown: |-
            `packages/http-server/demo` is a runnable catalog service demonstrating
            class-based API and site route groups, typed item/search/order models, defaulted
            query parameters, and AOT template-backed HTML pages with shared header and footer.
            Templates are compiled into the binary; deployment needs only public static assets.
            Its integration suite exercises real HTTP requests and checks typed body/output
            failures, HTML and static files, and mounted OpenAPI paths. Order quoting is
            stateless and does not create or persist orders. See the demo README for run and
            test commands.
        - type: markdown
          markdown: |-
            Annotated handlers can render pages with AOT templates from the `template` package.
            Templates are compiled into the application binary; deployments need no template
            files or runtime roots and require only public static assets. Render `.html`
            templates for automatic escaping, never use a safe filter on untrusted values, and
            create a fresh context for each render. Render failures propagate through the
            handler's `throws throwable` contract and produce HTTP 500; malformed request input
            remains HTTP 422.
  see-also: [http-server.api.routes, http-server.api.controller]
