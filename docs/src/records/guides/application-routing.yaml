documentation:
  status: complete
  title: "Application and routing"
  title-style: text
  summary: >-
    Build an application by composing controller-local routes, static directories,
    and a listen address with consuming builders.
  tags:
    - "http-server"
    - "routing"
    - "controllers"
  blocks:
    - type: markdown
      markdown: |-
        An application starts with `create-application`. Builders such as `mount`,
        `static-directory`, and `with-address` consume an application and return its
        successor, so retain each returned value while assembling the server. A controller
        implements `controller.routes`; the framework gives it a fresh `routes` builder
        scoped to that controller, and its callback returns the builder after registering
        handlers.

        Route paths registered inside a controller are relative to its mount prefix. Use
        a distinct variable name such as `registered-routes` for the builder; `routes` is
        also the type name. For exact callable forms, see
        [[http-server.api.application]], [[http-server.api.routes]], and
        [[http-server.api.controller]].
  sections:
    - id: composing-controllers
      title: "Composing controllers"
      blocks:
        - type: markdown
          markdown: |-
            A controller packages registrations, not a globally shared router. Mounting it
            at `/` merges its routes into the application root. A non-root prefix nests
            the controller's relative routes beneath that prefix. This allows root routes,
            prefixed controllers, and static directories to coexist. Choose distinct mount
            paths: configuration rejects duplicate paths rather than promising precedence.

            The following is a structural sketch, not a complete executable project; it
            emphasizes retaining the consuming builder results.
        - type: example
          id: builder-composition
          title: "Controller-local registration and application composition"
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            namespace routing-example

            from /streaky/http-server import controller, routes, create-application
            from /core/errors import throwable

            class site implements controller
                consuming function routes routes; registered-routes routes
                    return registered-routes.get; '/', this.home

                async function home string;
                    return 'Hello from this controller.'

            async function main none throws throwable;
                app = create-application;
                app = app.mount; '/', (instance site;)
                app = app.mount; '/admin', (instance site;)
                app = app.static-directory; '/assets', 'public'
                await app.serve;
                return none
          response: null
          diagnostic: null
          markdown: null
    - id: handlers-and-boundaries
      title: "Handlers and current boundary"
      blocks:
        - type: markdown
          markdown: |-
            The ordinary GET form takes an asynchronous handler returning `string`. The
            client-aware GET form instead supplies `client-info` to its asynchronous
            handler. WebSocket registrations use a separate endpoint method. The current
            API does not expose HTTP method selection, request objects, rich request
            extractors, structured responses, or general middleware; do not design a
            controller around those absent facilities.

            To start accepting connections, await the composed application's `serve` method.
            Binding and serving errors are surfaced by that operation through its declared
            throwable contract; it is not an error-to-HTTP recovery hook or a graceful
            shutdown API. Consult the API reference for its exact behavior and signature.
  see-also:
    - http-server.api.application
    - http-server.api.routes
    - http-server.api.controller
    - http-server.guide.configuration
    - http-server.tutorial.first-server

