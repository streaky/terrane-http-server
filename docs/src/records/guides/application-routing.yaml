documentation:
  status: complete
  title: "Application and routing"
  title-style: text
  summary: >-
    Compose class-bound annotated API endpoints, WebSocket registrations, static directories,
    and a listen address into an application.
  tags:
    - "routing"
    - "api"
  blocks:
    - type: markdown
      markdown: |-
        An application starts with `create-application`. Application composition
        mounts selected annotated API classes through the package consumer integration;
        `static-directory` and `with-address` consume an application and return its
        successor, so retain each result. HTTP endpoint methods on the selected
        `@route-group` classes declare `uses api`. Generated adapters register handlers
        through internal routing transport; applications do not author routes directly.
        WebSocket routing is separate and its public authoring interface is currently
        outside the documented HTTP API.
  sections:
    - id: composing-api-classes
      title: "Composing API classes"
      blocks:
        - type: markdown
          markdown: |-
            A route-group class packages annotated HTTP endpoints, not a globally shared
            router. The consumer composes selected API class instances through the
            application mount integration and their declared prefixes. A non-root prefix
            nests endpoint paths beneath that prefix. This allows API classes and static
            directories to coexist. Choose distinct mount paths: configuration rejects
            duplicate paths rather than promising precedence.

            The following is a structural sketch, not a complete executable project; it
            emphasizes retaining the consuming application builder results.
        - type: example
          id: builder-composition
          title: "Class-bound API composition"
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            namespace routing-example

            from /streaky/http-server import api, create-application
            from /streaky/http-server/annotations import route-group, endpoint
            from /core/errors import throwable

            @[route-group; prefix = '/']
            class site-api uses api
                @[endpoint; method = 'GET|HEAD', path = '/']
                async function home string;
                    return 'Hello from this API.'

            async function main none throws throwable;
                app = create-application;
                app = app.mount-annotated; '/site', (instance site-api;)
                app = app.static-directory; '/assets', 'public'
                await app.serve;
                return none
          response: null
          diagnostic: null
          markdown: null
    - id: handlers-and-boundaries
      title: "Class-bound handlers and request isolation"
      blocks:
        - type: markdown
          markdown: |-
            HTTP endpoints are instance methods on a selected `@route-group` class that
            declares `uses api`. Add `endpoint` metadata to each method; `method` accepts
            canonical uppercase methods such as `GET`, `HEAD`, or `GET|HEAD`. The latter
            registers both operations, with method-specific OpenAPI operations. A HEAD
            response suppresses the body while retaining representation metadata.

            The public `api` trait supplies optional `this.request` and `this.response`
            fields. Narrow each from `none` before using it. A generated adapter copies the
            mounted source into a local invocation for every request, attaches that request's
            contexts to the copy, then calls the instance method. The mounted source is not
            mutated, and simultaneous requests do not share these contexts. Helper methods
            called on that invocation see the same contexts.

            Ordinary class fields follow value semantics; a collection field is not
            automatically shared between invocations. For persistent application data,
            deliberately keep an explicit shared reference to a store. Keep mutations to
            that shared store appropriately synchronized, and do not retain request context
            as application state.

            WebSocket registrations remain separate from annotated HTTP methods. To start
            accepting connections, await the composed application's `serve` method.
            Binding and serving errors are surfaced by that operation through its declared
            throwable contract; it is not an error-to-HTTP recovery hook or graceful
            shutdown API.
  see-also:
    - http-server.api.application
