documentation:
  status: complete
  title: "WebSockets"
  title-style: text
  summary: >-
    Register an upgrade endpoint on a controller and use the typed session to receive
    event kinds, send text frames, and close explicitly.
  tags:
    - "http-server"
    - "websockets"
    - "networking"
  blocks:
    - type: markdown
      markdown: |-
        WebSocket endpoints are registered with the controller's `routes.websocket`
        builder. The asynchronous handler receives a Terrane `websocket-session`, not a
        transport extractor. Exact public signatures are documented on
        [[http-server.api.routes]], [[http-server.api.websocket-session]], and
        [[http-server.api.websocket-event]].
  sections:
    - id: registering-and-handling
      title: "Registering and handling a session"
      blocks:
        - type: markdown
          markdown: |-
            Build the endpoint with a path relative to the controller mount and a
            reusable asynchronous handler. This controller receives one event,
            echoes a text payload when present, and then closes the session.
            Mount it on an application as shown in the tutorial.
        - type: example
          id: session-operations
          title: "Text receive, send, and close"
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            namespace websocket-guide

            from /streaky/http-server import controller, routes, websocket-session
            from /core/errors import dependency-error

            class chat implements controller
                consuming function routes routes; registered-routes routes
                    return registered-routes.websocket; '/chat', this.echo

                async function echo none throws dependency-error; session websocket-session
                    event = await session.receive;
                    text = event.text
                    if text != none
                        await session.send-text; text
                    await session.close;
                    return none
          response: null
          diagnostic: null
          markdown: null
        - type: markdown
          markdown: |-
            `receive` returns an event whose `kind` preserves the transport message-kind
            spelling and case: a text event uses `text`, while non-text message variants
            currently retain names such as `Close`, `Binary`, `Ping`, and `Pong`.
            Only text events expose `event.text`; other event payloads are `none`.
            A completed stream returns the distinct lowercase `closed` kind.
            `send-text` sends a text frame, and `close` sends an explicit close frame.
    - id: errors-and-limits
      title: "Errors and limits"
      blocks:
        - type: markdown
          markdown: |-
            Session receive/send operations and the handler use the declared
            `dependency-error` contract. The framework catches a handler's dependency error
            after upgrade so a failed session does not terminate the HTTP server; this is
            not a general error-to-HTTP recovery mechanism. Upgrade requests still pass
            through the configured direct/client access policy, and denied upgrades receive
            403 before a session handler runs.

            The current API does not expose binary payloads, ping/pong payload operations,
            or richer message types. It also does not promise graceful server shutdown or
            broader request extraction. See [[http-server.guide.proxy-security]]
            for trusted identity and upgrade filtering.
  see-also:
    - http-server.api.routes
    - http-server.api.websocket-session
    - http-server.api.websocket-event
    - http-server.guide.proxy-security

