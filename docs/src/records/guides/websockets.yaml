documentation:
  status: complete
  title: WebSockets
  title-style: text
  summary: WebSocket session capabilities exposed to asynchronous handlers.
  tags: [http-server, websockets, networking]
  blocks:
    - type: markdown
      markdown: |-
        WebSocket endpoints are registered by framework routing, not through the HTTP `api` trait or a public route-builder callback. Their asynchronous handlers receive a Terrane `websocket-session`, not a transport extractor. Session and event operations are documented on [[http-server.api.websocket-session]] and [[http-server.api.websocket-event]]. The package does not currently document a public endpoint-authoring API for WebSockets.
  sections:
    - id: session-model
      title: Session model
      blocks:
        - type: markdown
          markdown: |-
            `receive` returns an event whose `kind` preserves the transport message-kind spelling and case: a text event uses `text`, while non-text message variants retain names such as `Close`, `Binary`, `Ping`, and `Pong`. Text events carry an optional `text` value.

            `send-text` sends a text frame, and `close` sends an explicit close frame. Transport failures use `dependency-error`; the framework catches an individual handler failure after upgrade so one failed session does not terminate the HTTP server.

            The current typed payload surface is text-first. Binary event payloads and explicit ping/pong payload APIs are not exposed.
      sections: []
  see-also:
    - http-server.api.websocket-session
    - http-server.api.websocket-event
    - http-server.guide.proxy-security
