documentation:
  status: complete
  title: "HTTP server"
  title-style: text
  summary: >-
    Build a Terrane application from class-bound HTTP APIs and static mounts, then
    serve it over TCP with optional client-address policy and WebSocket endpoints.
  tags:
    - "http-server"
    - "application-server"
    - "routing"
  blocks:
    - type: markdown
      markdown: |-
        `http-server` is a Terrane-native application server. Application code works with
        Terrane builders and interfaces; Axum, Tower HTTP, and Tokio are implementation
        dependencies rather than application-facing router or extractor APIs.

        Listeners are created through core `listen-tcp` and transferred to Axum with
        `into-native`. The package does not declare or import Tokio itself: core owns
        that runtime dependency and native transport boundary. Core's automatic listener
        backlog policy applies; Axum continues to provide HTTP and WebSocket handling.

        The package is experimental: class-bound HTTP endpoints use per-invocation
        request and response contexts, while static directories can be mounted and
        WebSocket handlers expose text plus event kinds. Typed endpoints support scalar
        path/query extraction, Terrane class or JSON document bodies and responses,
        and generated OpenAPI JSON. Nested model lists, class route groups, HTML pages,
        and annotated static mounts are supported. See
        [[http-server.guide.annotations]]. General middleware, dependency/state injection,
        and a broad WebSocket payload API remain outside the current surface.
    - type: example
      id: package-dependency
      title: "Package and capability requirements"
      language: toml
      mode: illustrative
      target: null
      timeout-ms: null
      source: |-
        [terrane-dependencies.streaky.http-server]
        path = "../http-server"

        [profile]
        capabilities = ["build", "networking", "filesystem", "clocks"]
      response: null
      diagnostic: null
      markdown: null
    - type: markdown
      markdown: |-
        In a consuming package, declare the library dependency by the path appropriate to
        your project. Allow its dependency effects in the active profile: serving requires
        networking and clocks for accept-retry backoff; static-file service requires
        filesystem capability. The manifest also declares build effects.
        Keep capability policy explicit in the consuming package; importing the library does not
        grant capabilities implicitly.
  sections:
    - id: start-here
      title: "Start here"
      blocks:
        - type: markdown
          markdown: |-
            Start with [[http-server.tutorial.first-server]] to assemble a small
            application. Then read [[http-server.guide.application-routing]],
            [[http-server.guide.configuration]], [[http-server.guide.proxy-security]],
            and [[http-server.guide.websockets]] for focused operational guidance.

            The API reference covers [[http-server.api.create-application]],
            [[http-server.api.application]], [[http-server.api.http-messages]],
            [[http-server.api.access-policy]], [[http-server.api.parse-config-yaml]],
            [[http-server.api.config-result]], [[http-server.api.server-config]],
            [[http-server.api.controller-mount]], [[http-server.api.static-mount]],
            [[http-server.api.websocket-session]], and
            [[http-server.api.websocket-event]].
            API pages define signatures; these guides explain how the pieces fit together.
      sections: []
