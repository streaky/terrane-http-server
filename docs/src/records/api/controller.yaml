  title: "controller"
  title-style: code
  summary: Framework application mount boundary, distinct from class-bound endpoint authoring.
  tags: [http-server, controller, routing]
  blocks:
    - type: markdown
      markdown: |-
        HTTP endpoints are authored as instance methods on selected classes using the public `api` trait and endpoint metadata. The framework/application composition mounts selected classes; generated adapters register their handlers through internal routing transport. This page describes the application mount boundary, not HTTP route authoring. See [[http-server.guide.annotations]] and [[http-server.guide.application-routing]].
