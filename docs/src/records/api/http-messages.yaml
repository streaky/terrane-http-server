documentation:
  status: complete
  title: HTTP requests and responses
  title-style: text
  summary: Request-scoped HTTP contexts, response defaults and overrides, and HTTP errors.
  tags: [http-server, requests, responses]
  blocks:
    - type: markdown
      markdown: |-
        An endpoint method on a class using the public `api` trait receives request-scoped
        `this.request` and `this.response` contexts. Both are optional outside dispatch;
        narrow them before use. Helpers called on the same invocation share these contexts.

        The trait fields are publicly assignable, but their attachment is framework-owned.
        Do not reassign `this.request` or `this.response`. In particular, replacing the
        response field does not replace the adapter's original finalization context:
        changes to a replacement object are not sent. Narrow the attached object into a
        local alias and use its methods instead.

        The request context exposes metadata getters only: `method() -> string`,
        `target() -> string` (original path and query), `path() -> string`,
        `route-pattern() -> string`, `http-version() -> string`, `scheme() -> string|none`,
        `authority() -> string|none`, `url() -> string|none`, `peer-ip() -> string|none`,
        `client-ip() -> string|none`, and `via-trusted-proxy() -> bool`.
        `header-value(name) -> string|none` returns the first valid text value;
        `header-values(name) -> list of string` returns repeated valid text values.
        Invalid UTF-8 header values are omitted from text accessors but retained by
        `header-bytes(name) -> list of bytes`. `cookie-value(name) -> string|none`
        returns the first matching raw cookie value without URL decoding.

        `path-value`, `query-value`, `accept-value`, and `json-body` belong to the
        internal incoming-request transport used by generated adapters; they are not
        public request-context methods. The request context is an immutable metadata
        snapshot and does not own or buffer the body.
        Capture is currently eager, including copies of all header names and raw values,
        even if a handler never reads `this.request`. Header-heavy workloads therefore
        pay a per-request copying cost. Lazy capture or a retained immutable native map
        could reduce that cost, but neither is implemented; preserving repeated values,
        invalid bytes, and request-local lifetimes remains required.
        Overhead depends on build mode and workload; debug-build comparisons do not
        establish release-throughput costs.

        The response context modifies response state for the current invocation:
        `set-status(status)`, `set-header(name, value)` (case-insensitive replacement),
        `add-header(name, value)` (preserves repeated values), `set-content-type(value)`,
        `set-content-length(length)` (for metadata-only HEAD responses), `vary(value)`,
        `redirect(location, status = 303)`, `set-cookie(name, value)`, and `clear-cookie(name)`.
        Cookie helpers append `Set-Cookie` with `Path=/; HttpOnly; SameSite=Lax`;
        clearing additionally uses `Max-Age=0`. `set-content-type` applies to raw/text
        bodies and must not disagree with a selected structured encoder. `vary` appends
        variation values. Header and status syntax is checked at the response boundary.

        Cookie attributes are currently fixed: helpers do not add `Secure`, even when
        the effective scheme is HTTPS, and do not offer configurable Path, Domain,
        lifetime, or SameSite options. When custom attributes are required, append a
        complete `Set-Cookie` value using `add-header` instead of using the fixed helper.
        This is a current API limitation, not automatic production cookie policy.

        Successful handler completion finalizes and closes response state; retained
        aliases cannot modify it afterward. Overrides apply only to normal completion,
        including deliberately returned error-status bodies. When a handler throws
        `http-error` or another failure, partial response overrides are discarded.

        A returned typed model, document, or scalar is encoded using the selected JSON,
        YAML, or XML format and defaults to status 200. A string endpoint configured for
        text/html uses that configured text type. A handler returning no value defaults
        to 204 with no body or content type. Explicit `set-status` overrides the default.
        Generated OpenAPI normally describes the declared return contract, not arbitrary
        runtime status changes. For a no-value HEAD operation it documents both the
        default 204 and the 200 metadata-only pattern.
        Other no-value methods document 204 alone as their generated success status;
        they do not acquire an inferred 200 response.
        Finalization suppresses the body and content type for 204 and 205; it suppresses
        the body but preserves content type for 304. HEAD suppresses the body while
        preserving representation headers. A metadata-only HEAD handler may return no
        value and set status 200, content length, and content type; an unknown length
        must not be represented as zero.

        With a nonempty enabled format list, generated adapters negotiate JSON, YAML, or XML using quality values, wildcards, specific exclusions, and canonical application media types. If no representation is acceptable, the server returns HTTP 406. A missing `Accept` uses the configured enabled default.

        Typed result encoding is performed by generated adapters. YAML emits JSON-compatible scalar quoting. XML uses a `response` root, named fields, wrapped `item` array elements, and `xsi:nil="true"` for null. Invalid XML names and control characters fail rather than producing malformed output.

        Throw `http-error` with a status from 400 through 599 and optional detail text to produce that HTTP error response. The server renders detail as plain text, using the canonical status reason when detail is empty. Malformed payloads fail closed as HTTP 500. Unrelated failures remain HTTP 500 without exposing internal exception details.

    - type: example
      id: response-context
      title: Setting response metadata
      language: terrane
      mode: illustrative
      target: null
      timeout-ms: null
      source: |-
        from /streaky/http-server import api

        class catalog-api uses api
            async function created string;
                response = this.response
                if response != none
                    response.set-status; 201
                    response.set-header; 'Location', '/items/1'
                return 'Created'
      response: null
      diagnostic: null
    - type: example
      id: request-context-and-errors
      title: Handling an item request and throwing an HTTP error
      language: terrane
      mode: illustrative
      target: null
      timeout-ms: null
      source: |-
        from /streaky/http-server import api, http-error
        from /streaky/http-server/annotations import route-group, endpoint, path

        @[route-group; prefix = '/api']
        class catalog-api uses api
            @[endpoint; method = 'GET', path = '/items/{id}']
            async function show string; (
                @[path;] id string,
            )
                if id == ''
                    throw http-error; 404, 'Catalog item not found'
                return id
      response: null
      diagnostic: null
