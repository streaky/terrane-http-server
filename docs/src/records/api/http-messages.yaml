documentation:
  status: complete
  title: HTTP requests and responses
  title-style: text
  summary: Request-scoped HTTP contexts, response defaults and overrides, and HTTP errors.
  tags: [http-server, requests, responses]
  blocks:
    - type: markdown
      markdown: |-
        An endpoint method on a class using the public `api` trait receives request-scoped
        `this.request` and `this.response` contexts. Both are optional outside dispatch;
        narrow them before use. Helpers called on the same invocation share these contexts.

        The trait fields are publicly assignable, but their attachment is framework-owned.
        Do not reassign `this.request` or `this.response`. In particular, replacing the
        response field does not replace the adapter's original finalization context:
        changes to a replacement object are not sent. Narrow the attached object into a
        local alias and use its methods instead.

        The request context exposes metadata getters only: `method() -> string`,
        `target() -> string` (original path and query), `path() -> string`,
        `route-pattern() -> string`, `http-version() -> string`, `scheme() -> string|none`,
        `authority() -> string|none`, `url() -> string|none`, `peer-ip() -> string|none`,
        `client-ip() -> string|none`, and `via-trusted-proxy() -> bool`.
        `path()` excludes the query and preserves percent escapes. On a mounted route it
        uses Axum's original URI when available; otherwise it uses the current request URI.
        `target()` uses the same URI selection, includes the query, and returns `/`
        if the selected URI has no path and query. `authority()` prefers the current
        URI's authority and otherwise accepts a `Host` value that HTTP can decode as text.
        `header-value(name) -> string|none` returns the first valid text value;
        `header-values(name) -> list of string` returns repeated valid text values.
        Invalid UTF-8 header values are omitted from text accessors but retained by
        `header-bytes(name) -> list of bytes`. `cookie-value(name) -> string|none`
        returns the first matching raw cookie value without URL decoding.
        The accessors scan borrowed values under one map guard. First-value lookup stops
        at the first valid text value; the list accessors preserve the order of the
        values they return. Invalid UTF-8 is never copied into a text result.

        `path-value`, `query-value`, `accept-value`, and `json-body` belong to the
        incoming-request transport used by generated adapters and low-level
        `application.route` handlers; they are not request-context methods.
        `header-byte-count` sums header-name and raw-value bytes, including repetitions.
        The count traverses borrowed header entries without making a snapshot.
        The request context is an immutable metadata
        snapshot and does not own or buffer the body.
        Header capture retains an owned native header map behind a shared handle, rather
        than rebuilding lists of every header name and raw byte value. Copying a request
        context shares this private immutable snapshot; it does not clone the map again.
        Capture still clones the native map once, so it is not allocation-free or a
        transfer of the original request's header storage. Accessors use a short-lived
        guard and materialize only the requested values, preserving their order, invalid
        bytes, and independence from later changes to the original request.
        Header lookup is case-insensitive; text access accepts valid UTF-8 and skips
        undecodable values. Returned lists and byte values do not expose mutable native
        storage. No guard is retained across an `await`. Other metadata remains captured
        eagerly; this is not general lazy request-context construction.

        Low-level `application.route(method, path, handler)` invokes its asynchronous
        incoming-request handler before body extraction, allowing authentication and
        admission first. The handler returns a `wire-response`; both transport types
        are imported from `/streaky/http-server/internal`.
        `incoming-request.json-body(maximum-bytes = 2097152, timeout-ms = 0,
        maximum-depth = 256)` retains the request while consuming its body once.
        `body-byte-count` reports the original bytes read after a successful read.
        A zero timeout disables the timer. Oversized bodies throw
        `request-body-limit` (HTTP 413); timed-out bodies throw
        `request-body-timeout` (HTTP 408). Other body-read transport failures return
        HTTP 400. Invalid JSON throws a coercion error.

        `incoming-request.multipart(maximum-bytes = 16777216, maximum-parts = 32,
        timeout-ms = 0)` consumes the same request body once and streams multipart
        fields in wire order. Both text fields and uploaded files are represented in
        `multipart-form.parts`; each `multipart-part` has a name and either a text
        value or an uploaded file. Text fields are fully buffered as UTF-8 strings;
        their size is bounded by the aggregate `maximum-bytes` limit, not a separate
        per-field limit. The multipart parser bounds aggregate body bytes and counts
        all parts, not only files; malformed content fails with a coercion error, and
        missing or unsupported multipart media type returns 415. A zero timeout
        disables timing. `body-byte-count` reports the aggregate bytes consumed on
        success. A part with `filename=""` remains an uploaded file (including when
        empty); it is distinct from a text field and is staged with the same cleanup
        rules. `form.field-values; name` returns the text values for that name in order.

        Uploaded file content is staged incrementally in a private, exclusively
        created temporary directory. Client filenames are untrusted metadata only;
        they are never used as filesystem paths. Dropping the form or an unclaimed
        uploaded file removes its temporary file and directory. The parser also
        cleans up completed and partial stages on failure, timeout, and disconnect.
        Remove a part from `form.parts` to transfer its ownership. Calling
        `uploaded-file.claim;` transfers cleanup responsibility and returns a
        server-generated UTF-8 path; a non-UTF-8 temporary path fails without
        consuming the staged upload. The caller must manage the file and directory.
        Staging failures produce HTTP 500 rather than returning a partial form.

        A wire response can hold a public `response-stream` producer. Its asynchronous
        `next-chunk` returns one text chunk or none at EOF; throwing aborts the body.
        Transport demand drives polling without an eager producer queue. `cancel`
        runs exactly once on EOF, error, disconnect, or body suppression for HEAD
        and bodyless statuses, including when the producer was never started.

        `compose-response-stream; parts` transfers a `list of response-part` into a
        single `response-stream`. Each `response-part` is an owning protocol with
        `next-chunk` and `cancel` operations. The composite pulls parts in list order
        and does not start a later part until the previous part reaches EOF. EOF
        finalizes that part; an error, disconnect, or suppressed body finalizes the
        active part and every queued part exactly once, including unstarted ones.
        A part need not have been polled to receive `cancel`. As with other response
        producers, do not poll the composite concurrently.

        `application.observe-transport` installs an optional per-application observer
        for headers, polled body data, completion, and drop events. Raw bytes use UTF-8
        or hexadecimal encoding; the observer owns any redaction policy. Observation
        does not pre-read request bodies or buffer response streams.
        Completion means the body source reached EOF (including a known-empty body),
        not that the peer acknowledged the bytes. The default capture limit applies
        to the aggregate request body and to each response chunk separately.

        The response context modifies response state for the current invocation:
        `set-status(status)`, `set-header(name, value)` (case-insensitive replacement),
        `add-header(name, value)` (preserves repeated values), `set-content-type(value)`,
        `set-content-length(length)` (for metadata-only HEAD responses), `vary(value)`,
        `redirect(location, status = 303)`, `set-cookie(name, value)`, and `clear-cookie(name)`.
        Cookie helpers append `Set-Cookie` with `Path=/; HttpOnly; SameSite=Lax`;
        clearing additionally uses `Max-Age=0`. `set-content-type` applies to raw/text
        bodies and must not disagree with a selected structured encoder. `vary` appends
        variation values. Header and status syntax is checked at the response boundary.

        Cookie attributes are currently fixed: helpers do not add `Secure`, even when
        the effective scheme is HTTPS, and do not offer configurable Path, Domain,
        lifetime, or SameSite options. When custom attributes are required, append a
        complete `Set-Cookie` value using `add-header` instead of using the fixed helper.
        This is a current API limitation, not automatic production cookie policy.

        Successful handler completion finalizes and closes response state; retained
        aliases cannot modify it afterward. Overrides apply only to normal completion,
        including deliberately returned error-status bodies. When a handler throws
        `http-error` or another failure, partial response overrides are discarded.

        A returned typed model, document, or scalar is encoded using the selected JSON,
        YAML, or XML format and defaults to status 200. A string endpoint configured for
        text/html uses that configured text type. A handler returning no value defaults
        to 204 with no body or content type. Explicit `set-status` overrides the default.
        Generated OpenAPI normally describes the declared return contract, not arbitrary
        runtime status changes. For a no-value HEAD operation it documents both the
        default 204 and the 200 metadata-only pattern.
        Other no-value methods document 204 alone as their generated success status;
        they do not acquire an inferred 200 response.
        Finalization suppresses the body and content type for 204 and 205; it suppresses
        the body but preserves content type for 304. HEAD suppresses the body while
        preserving representation headers. A metadata-only HEAD handler may return no
        value and set status 200, content length, and content type; an unknown length
        must not be represented as zero.
        Request body parsing keeps the existing compatibility behavior: a JSON body
        can be decoded by model adapters without requiring `Content-Type:
        application/json` when formats are omitted. Content-Type is a representation
        selection signal, not authorization or CSRF protection; enforce authorization
        and origin policy independently.

        With a nonempty enabled format list, generated adapters negotiate JSON, YAML, or XML using quality values, wildcards, specific exclusions, and canonical application media types. If no representation is acceptable, the server returns HTTP 406. A missing `Accept` uses the configured enabled default.

        Typed result encoding is performed by generated adapters. YAML emits JSON-compatible scalar quoting. XML uses a `response` root, named fields, wrapped `item` array elements, and `xsi:nil="true"` for null. Invalid XML names and control characters fail rather than producing malformed output.

        Throw `http-error` with a status from 400 through 599 and optional detail text to produce that HTTP error response. The server renders detail as plain text. When detail is empty, it uses the canonical status reason, or `HTTP error` if the status has no canonical reason. Malformed payloads fail closed as HTTP 500. Unrelated failures remain HTTP 500 without exposing internal exception details.

    - type: example
      id: response-context
      title: Setting response metadata
      language: terrane
      mode: illustrative
      target: null
      timeout-ms: null
      source: |-
        from /streaky/http-server import api

        class catalog-api uses api
            async function created string;
                response = this.response
                if response != none
                    response.set-status; 201
                    response.set-header; 'Location', '/items/1'
                return 'Created'
      response: null
      diagnostic: null
    - type: example
      id: request-context-and-errors
      title: Handling an item request and throwing an HTTP error
      language: terrane
      mode: illustrative
      target: null
      timeout-ms: null
      source: |-
        from /streaky/http-server import api, http-error
        from /streaky/http-server/annotations import route-group, endpoint, path

        @[route-group; prefix = '/api']
        class catalog-api uses api
            @[endpoint; method = 'GET', path = '/items/{id}']
            async function show string; (
                @[path;] id string,
            )
                if id == ''
                    throw http-error; 404, 'Catalog item not found'
                return id
      response: null
      diagnostic: null
