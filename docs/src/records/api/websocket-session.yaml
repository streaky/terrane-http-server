documentation:
  status: complete
  title: "websocket-session"
  title-style: code
  summary: Framework-owned asynchronous text send, close, and event receive operations for one upgraded connection.
  tags: [http-server, websocket, session]
  blocks:
    - type: markdown
      markdown: |-
        `websocket-session` has a private constructor and is obtained only by the framework
        after a successful upgrade, then passed to the registered callback. Its socket field
        is private and mutable; application code cannot construct or directly access the
        native socket. All three public operations are mutable and asynchronous, and can
        report `dependency-error` from transport operations.

        `send-text(text: string) -> async none throws dependency-error` sends a native text
        frame when the session still has a socket; it returns none. `close() -> async none
        throws dependency-error` sends a native `Close` frame when connected. Neither method
        explicitly clears the socket after sending.

        `receive() -> async websocket-event throws dependency-error` awaits one native receive
        when connected. Native `Text` becomes event kind lower-case `text` with its payload;
        `Close`, `Binary`, `Ping`, and `Pong` become events with those exact native names and
        no text payload. If the stream returns no frame (or the optional socket is absent),
        it returns kind `closed`, text `none`. See [[http-server.api.websocket-event]].

        The framework catches a callback's `dependency-error` after the upgrade, so a failed
        handler ends that session rather than propagating through the server loop. The API is
        text-oriented: there is no binary send or payload accessor for non-text events.
