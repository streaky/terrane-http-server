  title: "websocket-session"
  title-style: code
  summary: Asynchronous WebSocket sessions and managed groups with bounded per-session outbound queues.
  tags: [http-server, websocket, session]
  blocks:
    - type: markdown
      markdown: |-
        `websocket-session` has a private constructor and is obtained only by the framework
        after a successful upgrade, then passed to the registered callback. Its socket field
        is private and mutable; application code cannot construct or directly access the
        native socket. The public session operations are mutable and asynchronous.
        `send-text`, `close`, and `receive` can report concrete native transport throwables.

        `send-text(text: string) -> async none throws throwable` sends a native text
        frame when the session still has a socket; it returns none. `close() -> async none
        throws throwable` sends a native `Close` frame when connected. Neither method
        explicitly clears the socket after sending.

        `receive() -> async websocket-event throws throwable` awaits one native receive
        when connected. Native `Text` becomes event kind lower-case `text` with its payload;
        `Close`, `Binary`, `Ping`, and `Pong` retain those exact native names with no text
        payload. An exhausted stream or absent socket returns kind `closed`, text `none`.
        See [[http-server.api.websocket-event]].

        The framework catches a callback's throwable after the upgrade, including concrete
        native errors from abrupt TCP disconnects. A failed handler ends that session rather
        than terminating the server or retaining a connection-limit slot.
        Migration: handlers calling these methods that declared `throws dependency-error`
        must widen to `throws throwable`. Errors are not normalized to `dependency-error`;
        catching a particular native type requires its descriptor import, while a broad
        `catch throwable` needs no native import.

        `websocket-group` owns a map of session IDs to bounded outbound senders. Call
        `register(id, capacity)` with a positive capacity to obtain a
        `websocket-subscription`, then pass it to `websocket-session.receive-managed`.
        This receive operation waits for either a socket event or a queued group message;
        queued text is sent on the connection's own socket and returned as event kind `sent`.
        Removing an endpoint (or registering a replacement with the same ID) lets
        its session send any already queued messages, then issue a WebSocket close
        from the connection loop. Dropping the subscription closes its receiver; a
        later broadcast detects and removes that stale endpoint. `broadcast(text)` returns
        the number of queues that accepted the text. Full queues skip that session without
        delaying others or removing it. `remove(id)` affects only that ID. Group map access
        is synchronous, and neither session nor group locks are held across an await.
        The API is text-oriented: there is no binary send or payload accessor for non-text events.
