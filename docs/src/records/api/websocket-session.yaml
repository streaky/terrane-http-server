  title: "websocket-session"
  title-style: code
  summary: Framework-owned asynchronous text send, close, and event receive operations for one upgraded connection.
  tags: [http-server, websocket, session]
  blocks:
    - type: markdown
      markdown: |-
        `websocket-session` has a private constructor and is obtained only by the framework
        after a successful upgrade, then passed to the registered callback. Its socket field
        is private and mutable; application code cannot construct or directly access the
        native socket. All three public operations are mutable and asynchronous, and can
        report concrete native transport throwables.

        `send-text(text: string) -> async none throws throwable` sends a native text
        frame when the session still has a socket; it returns none. `close() -> async none
        throws throwable` sends a native `Close` frame when connected. Neither method
        explicitly clears the socket after sending.

        `receive() -> async websocket-event throws throwable` awaits one native receive
        when connected. Native `Text` becomes event kind lower-case `text` with its payload;
        `Close`, `Binary`, `Ping`, and `Pong` retain those exact native names with no text
        payload. An exhausted stream or absent socket returns kind `closed`, text `none`.
        See [[http-server.api.websocket-event]].

        The framework catches a callback's throwable after the upgrade, including concrete
        native errors from abrupt TCP disconnects. A failed handler ends that session rather
        than terminating the server or retaining a connection-limit slot.
        The API is text-oriented: there is no binary send or payload accessor for non-text events.
