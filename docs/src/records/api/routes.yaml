documentation:
  status: complete
  title: "routes"
  title-style: code
  summary: Controller-local consuming builder for text GET, typed HTTP, and WebSocket registrations.
  tags: [http-server, routing, controllers]
  blocks:
    - type: markdown
      markdown: |-
        `routes` has no public constructor: the framework supplies a fresh builder to
        `controller.routes`. Route paths are relative to the controller's mount prefix.
        Each registration consumes and returns the builder, so retain the returned value.

        `get(path: string, handler: async function to string) -> routes` registers a GET
        handler. The handler receives no request arguments and returns response text.
        Ordinary asynchronous handlers may declare `throws throwable`; handler failures
        propagate as HTTP 500.

        `get-with-client(path: string, handler: async function from client-info to string)
        -> routes` registers a GET handler supplied with peer and resolved-client addresses.
        Ordinary asynchronous handlers may declare `throws throwable`; handler failures
        propagate as HTTP 500. Address resolution follows the application's trust policy; see
        [[http-server.guide.proxy-security]].

        `endpoint(method: http-method, path: string, handler: async function from http-request
        to http-response throws throwable) -> routes` registers a typed HTTP callback. The
        closed `http-method` enum has `get`, `post`, `put`, `patch`, and `delete` variants.
        The callback receives decoded path/query access and bounded JSON body decoding,
        and returns an explicit status, content type, and encoded body. Path, query, and body
        conversion failures return HTTP 422 before invocation; callback and render failures
        return HTTP 500. See [[http-server.api.http-messages]] and
        [[http-server.guide.annotations]] for the generated adapter surface.

        `websocket(path: string, handler: async function from websocket-session to none
        throws dependency-error) -> routes` registers a WebSocket endpoint. Its callback is
        asynchronous; session failures use `dependency-error`. The framework handles an
        individual callback failure after upgrade rather than terminating the HTTP server.
        Event and session operations are described in [[http-server.api.websocket-session]]
        and [[http-server.api.websocket-event]].
