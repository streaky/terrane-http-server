  title: "routes"
  title-style: code
  summary: Controller-local consuming builder for text GET, typed HTTP, and WebSocket registrations.
  tags: [http-server, routing, controllers]
  blocks:
    - type: markdown
      markdown: |-
        `routes` has no public constructor: the framework supplies a fresh builder to
        `controller.routes`. Route paths are relative to the controller's mount prefix.
        Each registration consumes and returns the builder, so retain the returned value.

        `get(path: string, handler: async function to string throws throwable) -> routes`
        registers a GET handler returning text. `get-with-client(path: string, handler:
        async function from client-info to string throws throwable) -> routes` also supplies
        peer and resolved-client addresses. Both permit ordinary throwing handlers:
        `http-error` produces its requested error response; unrelated failures produce 500.
        Address resolution follows the application's trust policy described in
        [[http-server.guide.proxy-security]].

        `endpoint(method: http-method, path: string, handler: async function from http-request
        to http-response throws throwable, vary-accept: bool = false) -> routes` registers
        `get`, `post`, `put`, `patch`, `delete`, `head`, and `options` variants. GET may
        also be served for HEAD by the framework; register an explicit HEAD endpoint to
        override that behavior. HEAD responses are bodyless on the wire. OPTIONS invokes
        only an explicitly registered handler and does not enable automatic CORS behavior.
        The callback receives decoded path/query access and bounded JSON body decoding,
        and returns an explicit status, content type, body, and additional headers. Path,
        query, and body conversion failures return HTTP 422 before invocation. A caught
        `http-error` preserves its error response, while unrelated callback, render, and
        response conversion failures return HTTP 500. See [[http-server.api.http-messages]]
        and [[http-server.guide.annotations]] for the response factories and generated adapters.
        Set `vary-accept` when the handler performs content negotiation. It adds the `Accept`
        token to `Vary` for every response path, including input rejection and failures,
        preserving existing tokens and avoiding duplicates. It does not select or encode a
        representation itself. Generated adapters set it only for explicitly negotiated
        automatic responses; legacy JSON, HTML/text, and explicit-response handlers leave it off.

        `websocket(path: string, handler: async function from websocket-session to none
        throws dependency-error) -> routes` registers a WebSocket endpoint. Its callback is
        asynchronous; session failures use `dependency-error`. The framework handles an
        individual callback failure after upgrade rather than terminating the HTTP server.
        Event and session operations are described in [[http-server.api.websocket-session]]
        and [[http-server.api.websocket-event]].
