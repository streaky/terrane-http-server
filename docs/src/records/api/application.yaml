  title: "application"
  title-style: code
  summary: Consuming builder and serving boundary for a composed HTTP application.
  tags: [http-server, application, server]
  blocks:
    - type: markdown
      markdown: |-
        Obtain an application with [[http-server.api.create-application]]; its constructor is private. `address: string` is publicly readable and writable state, initially `127.0.0.1:3000`. Builder methods consume `application` and return its successor; assign every result.

        Ordinary HTTP handlers are class-bound through annotated API classes and
        generated adapters. WebSocket upgrades have the separate public
        `websocket(path, handler) -> application` registration method: the asynchronous
        callback receives an owned `websocket-session` and returns `none`, with
        `throwable` as its error contract. Handlers that call session methods and previously
        declared `throws dependency-error` must widen to `throws throwable`. Native errors
        are not normalized; selective catches require their native descriptors. No internal routing import is
        required. See [[http-server.guide.websockets]] for a complete example.
        Native-router registration helpers are implementation details, not public
        authoring APIs; use this method rather than constructing native routes.
        WebSocket registrations are installed after mounted/static routes, independent of
        builder call order. Conflicts fail during serving setup before either accept loop starts.

        `static-directory(prefix: string, directory: string) -> application` mounts the directory service under the prefix. Serving static content requires filesystem capability.

        `with-address(address: string) -> application` replaces the listen address without validating it at this point.

        `with-connection-limit(maximum: uint32) -> application` bounds accepted TCP
        connections; `0` is the unlimited default. Keep-alive connections and upgraded
        WebSocket sessions retain their slots until their final owners finish.
        Multiplexed HTTP/2 requests share one transport slot. At capacity, the server
        waits before accepting another connection; operating-system backlog behavior
        applies rather than an HTTP 503 guarantee. All serving methods honor this
        setting. Ordinary `serve` and `serve-listener` eagerly create `maximum`
        Terrane workers, each retaining a router handle and waiting on the shared
        listener. The graceful `*-until` methods instead create native connection
        tasks as sockets are accepted, up to the same limit. In both cases, a native
        channel sender's final drop releases a slot, including after an upgrade.
        Routes and policies are composed once; service-level extensions carry the peer and lease.
        Failed accepts are reported to stderr with target `http-server.accept`,
        then back off for one second and retry. Ordinary serving uses structured
        source logging; graceful serving emits a native contextual diagnostic.
        Persistent failures continue retrying; there is no consecutive-failure
        shutdown threshold. Per-connection setup/transport failures are isolated.
        A limit is not an allocator-trimming or response-streaming policy.
        Explicit capability profiles need `clocks` and `logging` for the source
        retry path; slot release does not require the `threads` capability.

        Availability warning: neither path configures a header-read or idle timeout.
        `maximum` silent or idle keep-alive clients can exhaust all limited slots indefinitely,
        preventing other requests. Use a trusted deployment or proxy-enforced upstream
        header/idle/lifetime limits. The connection cap alone is not slow-client protection.
        No timeout configuration is exposed here.

        Limited mode supports HTTP/1.1 WebSocket upgrades and cleartext HTTP/2 prior knowledge
        (h2c), but does not enable RFC 8441 extended CONNECT for WebSockets over HTTP/2.

        `configure(config: server-config) -> application` replaces the address and mounts every configured static directory in list order. It does not resolve or mount configured controller identifiers; resolve those with `server-config.controller-path` and explicitly compose the matching selected API class.

        `allow-direct(network: string) -> application` and `allow-client(network: string) -> application` append entries to independent address/network allowlists. Empty lists are permissive; malformed networks surface when serving begins. Detailed trust and forwarding behavior is in [[http-server.guide.proxy-security]].

        `has-routes() -> bool` is a non-consuming query indicating whether the internal router has registered routes.

        `serve() -> async none throws throwable` consumes the application. It binds the configured address, compiles both network policies, installs request checks, then serves until the server terminates. Binding and policy compilation errors propagate as `throwable`; denied requests receive HTTP 403. A direct peer must pass its policy, and the resolved client address must pass its independent policy. Forwarded identity is trusted only from a permitted direct peer when the direct policy is non-permissive; otherwise the TCP peer is the client address. No shutdown handle is returned.
        Policy parsing retains its native error identity within the `throwable`
        contract; it is not narrowed or normalized to `dependency-error`. A broad
        catch needs no native import, while selective handling requires the parser's
        native error descriptor.

        `serve-listener(bound: /core/networking::tcp-listener) -> async none throws throwable`
        consumes both the application and an already-bound core listener. It uses that
        listener without rebinding or consulting `application.address`, and applies the
        same network policies, middleware, and HTTP serving behavior as `serve`.
        Bind `127.0.0.1:0` with core `listen-tcp`, read the listener's `local-address`
        to discover the OS-assigned port, then transfer it with
        `await app.serve-listener; move listener`. The printed address and served socket
        are the same; no reserve-and-release port-selection race is needed.

        `serve-until(shutdown: async function to none throws throwable)`,
        `serve-listener-until(bound: tcp-listener, shutdown: async function to none
        throws throwable)`, and `serve-listeners-until(bounds: list of tcp-listener,
        shutdown: async function to none throws throwable)` consume the application
        and provide graceful shutdown. The callback takes no arguments and is awaited
        concurrently with serving. Completion, including a thrown error, closes all
        listening sockets and stops accepting new connections. Active HTTP responses
        and upgraded WebSocket sessions are then drained before returning. A callback
        error retains its original identity and propagates only after that drain.

        These methods preserve route composition, network policies, peer metadata,
        WebSocket support, and connection limits. The listener overloads use the
        supplied sockets without rebinding or consulting `application.address`.
        `serve-listeners-until` consumes a nonempty list of bound listeners and
        accepts across them concurrently. The connection cap is shared globally.
        Setup failures propagate before the shutdown callback starts.
        There is no implicit grace timeout or forced WebSocket close: applications
        must arrange their own cancellation/close policy if active work or sessions
        must finish within a deadline. Cancelling the serving operation itself is
        not a graceful-shutdown request.
