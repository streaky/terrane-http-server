  title: "application"
  title-style: code
  summary: Consuming builder and serving boundary for a composed HTTP application.
  tags: [http-server, application, server]
  blocks:
    - type: markdown
      markdown: |-
        Obtain an application with [[http-server.api.create-application]]; its constructor is private. `address: string` is publicly readable and writable state, initially `127.0.0.1:3000`. Builder methods consume `application` and return its successor; assign every result.

        Ordinary HTTP handlers are class-bound through annotated API classes and
        generated adapters. WebSocket upgrades have the separate public
        `websocket(path, handler) -> application` registration method: the asynchronous
        callback receives an owned `websocket-session` and returns `none`, with
        `dependency-error` as its throwable contract. No internal routing import is
        required. See [[http-server.guide.websockets]] for a complete example.
        Native-router registration helpers are implementation details, not public
        authoring APIs; use this method rather than constructing native routes.

        `static-directory(prefix: string, directory: string) -> application` mounts the directory service under the prefix. Serving static content requires filesystem capability.

        `with-address(address: string) -> application` replaces the listen address without validating it at this point.

        `with-connection-limit(maximum: uint32) -> application` bounds accepted TCP
        connections; `0` is the unlimited default. Keep-alive connections and upgraded
        WebSocket sessions retain their slots until their final owners finish.
        Multiplexed HTTP/2 requests share one transport slot. At capacity, the server
        waits before accepting another connection; operating-system backlog behavior
        applies rather than an HTTP 503 guarantee. Both serving methods honor this
        setting. Terrane workers implement admission, and a shared completion lifetime
        prevents an upgrade from releasing a slot early. Serving requires the `threads`
        capability; a limit is not an allocator-trimming or response-streaming policy.

        `configure(config: server-config) -> application` replaces the address and mounts every configured static directory in list order. It does not resolve or mount configured controller identifiers; resolve those with `server-config.controller-path` and explicitly compose the matching selected API class.

        `allow-direct(network: string) -> application` and `allow-client(network: string) -> application` append entries to independent address/network allowlists. Empty lists are permissive; malformed networks surface when serving begins. Detailed trust and forwarding behavior is in [[http-server.guide.proxy-security]].

        `has-routes() -> bool` is a non-consuming query indicating whether the internal router has registered routes.

        `serve() -> async none throws throwable` consumes the application. It binds the configured address, compiles both network policies, installs request checks, then serves until the server terminates. Binding and policy compilation errors propagate as `throwable`; denied requests receive HTTP 403. A direct peer must pass its policy, and the resolved client address must pass its independent policy. Forwarded identity is trusted only from a permitted direct peer when the direct policy is non-permissive; otherwise the TCP peer is the client address. No shutdown handle is returned.

        `serve-listener(bound: /core/networking::tcp-listener) -> async none throws throwable`
        consumes both the application and an already-bound core listener. It uses that
        listener without rebinding or consulting `application.address`, and applies the
        same network policies, middleware, and HTTP serving behavior as `serve`.
        Bind `127.0.0.1:0` with core `listen-tcp`, read the listener's `local-address`
        to discover the OS-assigned port, then transfer it with
        `await app.serve-listener; move listener`. The printed address and served socket
        are the same; no reserve-and-release port-selection race is needed.
